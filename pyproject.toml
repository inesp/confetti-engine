[project]
name = "confetti-engine"
version = "0.1.0"
description = "Conference CFP tracker and Google Calendar sync"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.0,<4.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18",
    "google-auth-oauthlib>=1.2.1",
    "requests>=2.32",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["confetti*"]
exclude = ["conferences*", "credentials*", "venv*"]

[dependency-groups]
dev = [
    "black>=24.10.0",
    "freezegun>=1.5.5",
    "mypy>=1.14.0",
    "pytest>=8.0",
    "ruff>=0.8.4",
    "types-flask>=1.1.6",
    "types-pyyaml>=6.0.12",
    "types-requests>=2.32",
]

[tool.mypy]
[[tool.mypy.overrides]]
module = ["google_auth_oauthlib.*", "google.*"]
ignore_missing_imports = true

[tool.black]
line-length = 118
target-version = ['py313']
