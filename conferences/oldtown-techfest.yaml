# Four tracked editions (2023-2026), one of each outcome: 2023 withdrawn, 2024 rejected,
# 2025 and 2026 accepted. The mixed record is what paints a three-colour pill on /past.
# 2025 done and paid; 2026 has two talks with different outcomes. budget full, difficulty hard.
- name: "Old Town Tech Fest"
  city: "Prague"
  country: "Czechia"
  website: "https://example.com/oldtown-techfest"

  cfp:
    url: "https://sessionize.com/oldtown-techfest"
    site: "sessionize"
    formats: "45min, keynote"
    notes: "Invited keynote slot some years."
    presumed_open: "03-15"
    presumed_close: "05-01"

  budget: full
  difficulty: hard
  topic_fit: "example-async, example-refactoring, example-keynote"
  notes: "One of the good ones. Been twice."

  presumed:
    conference_start: "09-18"
    conference_end: "09-19"

  years:
    2023:
      cfp_open: 2023-03-15
      cfp_close: 2023-05-01
      notify: "Notified 2 Jun"
      conference_start: 2023-09-18
      conference_end: 2023-09-19
      talks:
        - talk: example-keynote
          status: withdrawn
          title: "Example Talk: A Sample Keynote"
    2024:
      cfp_open: 2024-03-15
      cfp_close: 2024-05-01
      notify: "Notified 5 Jun"
      conference_start: 2024-09-18
      conference_end: 2024-09-19
      talks:
        - talk: example-observability
          status: rejected
          title: "Example Talk: Observability"
    2025:
      cfp_open: 2025-03-14
      cfp_close: 2025-04-30
      notify: "Notified 1 Jun"
      conference_start: 2025-09-18
      conference_end: 2025-09-19
      cost:
        flight: 110
        hotel: 220
        extra: 70
        promised: 450
        covered: 450
      vacation_days: 1
      talks:
        - talk: example-testing
          status: accepted
          title: "Example Talk: Testing"
          talk_start: 2025-09-18 14:00
          talk_duration: 45
    2026:
      cfp_open: 2026-03-16
      cfp_close: 2026-05-01
      notify: "Decisions by 10 Jun"
      conference_start: 2026-09-18
      conference_end: 2026-09-19
      cost:
        flight: 130
        hotel: 240
        extra: 80
        promised: 500
        covered: 500
      vacation_days: 2
      talks:
        - talk: example-async
          status: accepted
          title: "Example Talk: Async Things"
          talk_start: 2026-09-18 10:00
          talk_duration: 45
        - talk: example-refactoring
          status: rejected
          title: "Example Talk: Refactoring"
